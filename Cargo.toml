[package]
name = "vpn-tui"
version = "0.1.0"
edition = "2021"
description = "TUI para gestionar conexiones OpenVPN3 y OpenFortiVPN"
license = "MIT"

[[bin]]
name = "vpn-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "1"
anyhow = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
